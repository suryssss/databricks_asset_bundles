# E-Commerce Data Pipeline — Databricks Asset Bundle Configuration
# Deploys a Bronze → Silver → Gold pipeline with TEST and PROD environments.
# See https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: ecommerce_pipeline
  uuid: 5a6214e1-6f09-42d3-a29e-ab80e5cdd93d

include:
  - resources/*.yml

# Variable declarations — assigned per-target below
variables:
  catalog:
    description: The Unity Catalog catalog to use
  schema:
    description: The schema (database) for this environment

targets:
  # ── DEV: personal development sandbox ──
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-4cc5c7f9-4515.cloud.databricks.com
      profile: rithwik11
    variables:
      catalog: workspace
      schema: ecommerce_dev

  # ── TEST: integration testing before production ──
  test:
    mode: development
    workspace:
      host: https://dbc-4cc5c7f9-4515.cloud.databricks.com
      profile: rithwik11
    variables:
      catalog: workspace
      schema: ecommerce_test

  # ── PROD: production deployment ──
  prod:
    mode: production
    workspace:
      host: https://dbc-4cc5c7f9-4515.cloud.databricks.com
      profile: rithwik11
      root_path: /Workspace/Users/surya.rithwik2005@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: ecommerce_prod
    permissions:
      - user_name: surya.rithwik2005@gmail.com
        level: CAN_MANAGE
