# This is a Declarative Automation Bundle definition for cicd_using_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cicd_using_dab
  uuid: 5a6214e1-6f09-42d3-a29e-ab80e5cdd93d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4cc5c7f9-4515.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  test:
    # Test environment for integration testing before promoting to prod.
    # Uses development mode so schedules are paused and resources are prefixed.
    mode: development
    workspace:
      host: https://dbc-4cc5c7f9-4515.cloud.databricks.com
    variables:
      catalog: workspace
      schema: test
  prod:
    mode: production
    workspace:
      host: https://dbc-4cc5c7f9-4515.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/surya.rithwik2005@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/surya.rithwik2005@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: surya.rithwik2005@gmail.com
        level: CAN_MANAGE
