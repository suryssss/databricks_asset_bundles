# E-Commerce Pipeline — Databricks Workflow Definition
# Defines the full Bronze → Silver → Gold DAG with task dependencies.

resources:
  jobs:
    ecommerce_pipeline:
      name: ecommerce_pipeline

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        # ── Setup (runs first) ──
        - task_key: setup_volumes
          notebook_task:
            notebook_path: ../src/setup/setup_volumes.py
            source: WORKSPACE

        # ── Bronze (4 parallel tasks, depend on setup) ──
        - task_key: bronze_customers
          depends_on:
            - task_key: setup_volumes
          notebook_task:
            notebook_path: ../src/bronze/ingest_customers.py
            source: WORKSPACE

        - task_key: bronze_products
          depends_on:
            - task_key: setup_volumes
          notebook_task:
            notebook_path: ../src/bronze/ingest_products.py
            source: WORKSPACE

        - task_key: bronze_orders
          depends_on:
            - task_key: setup_volumes
          notebook_task:
            notebook_path: ../src/bronze/ingest_orders.py
            source: WORKSPACE

        - task_key: bronze_order_items
          depends_on:
            - task_key: setup_volumes
          notebook_task:
            notebook_path: ../src/bronze/ingest_order_items.py
            source: WORKSPACE

        # ── Silver (depends on all Bronze) ──
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_customers
            - task_key: bronze_products
            - task_key: bronze_orders
            - task_key: bronze_order_items
          notebook_task:
            notebook_path: ../src/silver/transform_silver.py
            source: WORKSPACE

        # ── Gold (3 parallel tasks, depend on Silver) ──
        - task_key: gold_daily_sales
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../src/gold/daily_sales.py
            source: WORKSPACE

        - task_key: gold_product_sales
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../src/gold/product_sales.py
            source: WORKSPACE

        - task_key: gold_customer_sales
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../src/gold/customer_sales.py
            source: WORKSPACE

      # Serverless compute — required for Databricks Free Edition
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
