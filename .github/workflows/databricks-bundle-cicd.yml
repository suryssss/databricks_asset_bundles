# E-Commerce Data Pipeline — CI/CD Workflow
# Complete automated lifecycle:
#   1. Unit Tests (pytest on data transformation logic)
#   2. Bundle Validation (validates DAB configurations across dev, test, prod)
#   3. Test Deployment (creates schema/volume, uploads raw data, deploys bundle, runs pipeline in TEST)
#   4. Prod Deployment (promotes to PROD: creates schema/volume, uploads data, deploys bundle, runs pipeline in PROD)

name: E-Commerce Pipeline CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feature/*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target (both, test-only, prod-only)"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "test-only"
          - "prod-only"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Unit Tests (No cluster needed)
  # ──────────────────────────────────────────────
  unit-tests:
    name: "🧪 Run Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Pytest Suite
        run: pytest tests/test_transformations.py -v

  # ──────────────────────────────────────────────
  # Stage 2: Validate Databricks Asset Bundle
  # ──────────────────────────────────────────────
  validate:
    name: "🔍 Validate Bundle"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks Authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p ~/.databrickscfg.d
          cat <<EOF > ~/.databrickscfg
          [DEFAULT]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN

          [rithwik11]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN
          EOF
          chmod 600 ~/.databrickscfg

      - name: Validate Dev Target
        run: databricks bundle validate -t dev

      - name: Validate Test Target
        run: databricks bundle validate -t test

      - name: Validate Prod Target
        run: databricks bundle validate -t prod

  # ──────────────────────────────────────────────
  # Stage 3: Deploy + Upload Data + Run in TEST
  # ──────────────────────────────────────────────
  deploy-test:
    name: "🚀 Deploy & Run (Test)"
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'test-only'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks Authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p ~/.databrickscfg.d
          cat <<EOF > ~/.databrickscfg
          [DEFAULT]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN

          [rithwik11]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN
          EOF
          chmod 600 ~/.databrickscfg

      - name: Ensure Schema and Volume Exist in Test
        run: |
          echo "Ensuring workspace.ecommerce_test schema exists..."
          databricks schemas create ecommerce_test workspace || true
          echo "Ensuring workspace.ecommerce_test.raw_data volume exists..."
          databricks volumes create workspace ecommerce_test raw_data MANAGED || true

      - name: Deploy Bundle to Test
        run: databricks bundle deploy -t test

      - name: Upload Raw CSV Data to Test Volume
        run: |
          echo "Uploading data files to test volume..."
          for file in data/*.csv; do
            echo "  Uploading $(basename "$file")..."
            databricks fs cp "$file" "dbfs:/Volumes/workspace/ecommerce_test/raw_data/$(basename "$file")" --overwrite
          done
          echo "✅ All data files uploaded"
          echo "Listing volume contents:"
          databricks fs ls dbfs:/Volumes/workspace/ecommerce_test/raw_data/

      - name: Run Pipeline in Test
        run: databricks bundle run -t test ecommerce_pipeline

  # ──────────────────────────────────────────────
  # Stage 4: Deploy + Upload Data + Run in PROD
  # ──────────────────────────────────────────────
  deploy-prod:
    name: "🏭 Deploy & Run (Prod)"
    needs: [validate, deploy-test]
    if: |
      always() &&
      (needs.validate.result == 'success') &&
      (needs.deploy-test.result == 'success' || inputs.target == 'prod-only') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'prod-only'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks Authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p ~/.databrickscfg.d
          cat <<EOF > ~/.databrickscfg
          [DEFAULT]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN

          [rithwik11]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN
          EOF
          chmod 600 ~/.databrickscfg

      - name: Ensure Schema and Volume Exist in Prod
        run: |
          echo "Ensuring workspace.ecommerce_prod schema exists..."
          databricks schemas create ecommerce_prod workspace || true
          echo "Ensuring workspace.ecommerce_prod.raw_data volume exists..."
          databricks volumes create workspace ecommerce_prod raw_data MANAGED || true

      - name: Deploy Bundle to Prod
        run: databricks bundle deploy -t prod

      - name: Upload Raw CSV Data to Prod Volume
        run: |
          echo "Uploading data files to prod volume..."
          for file in data/*.csv; do
            echo "  Uploading $(basename "$file")..."
            databricks fs cp "$file" "dbfs:/Volumes/workspace/ecommerce_prod/raw_data/$(basename "$file")" --overwrite
          done
          echo "✅ All data files uploaded"
          echo "Listing volume contents:"
          databricks fs ls dbfs:/Volumes/workspace/ecommerce_prod/raw_data/

      - name: Run Pipeline in Prod
        run: databricks bundle run -t prod ecommerce_pipeline