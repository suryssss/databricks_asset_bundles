# E-Commerce Pipeline — CI/CD with Databricks Asset Bundles
# Workflow: Validate → Deploy + Upload Data + Run (Test) → Deploy + Upload Data + Run (Prod)

name: E-Commerce Pipeline CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Validate bundle on every push and PR
  # ──────────────────────────────────────────────
  validate:
    name: "✅ Validate Bundle"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Asset Bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate

  # ──────────────────────────────────────────────
  # Stage 2: Deploy, upload data, and run in TEST
  # ──────────────────────────────────────────────
  deploy_test:
    name: "🧪 Deploy + Run Test"
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to Test
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target test

      - name: Upload CSV Data to Test Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "📤 Uploading data files to test volume..."
          for file in data/*.csv; do
            echo "  Uploading $(basename $file)..."
            databricks fs cp "$file" "dbfs:/Volumes/workspace/ecommerce_test/raw_data/$(basename $file)" --overwrite
          done
          echo "✅ All data files uploaded"

      - name: Run Pipeline in Test
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle run --target test ecommerce_pipeline

  # ──────────────────────────────────────────────
  # Stage 3: Deploy, upload data, and run in PROD
  # ──────────────────────────────────────────────
  deploy_prod:
    name: "🏭 Deploy + Run Prod"
    needs: deploy_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to Prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target prod

      - name: Upload CSV Data to Prod Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "📤 Uploading data files to prod volume..."
          for file in data/*.csv; do
            echo "  Uploading $(basename $file)..."
            databricks fs cp "$file" "dbfs:/Volumes/workspace/ecommerce_prod/raw_data/$(basename $file)" --overwrite
          done
          echo "✅ All data files uploaded"

      - name: Run Pipeline in Prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle run --target prod ecommerce_pipeline